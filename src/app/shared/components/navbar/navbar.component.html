<header
  class="sticky top-0 z-50 w-full border-b border-[var(--color-border)] bg-[var(--color-background)]"
>
  <nav
    class="mx-auto flex h-20 max-w-[1440px] items-center justify-between px-6 lg:px-10"
  >

    <!-- ===================================================== -->
    <!-- LOGO -->
    <!-- ===================================================== -->

    <a
      routerLink="/"
      aria-label="SA Home"
      class="text-xl font-semibold tracking-[0.25em]"
    >
      SA
    </a>


    <!-- ===================================================== -->
    <!-- DESKTOP NAVIGATION -->
    <!-- ===================================================== -->

    <div class="hidden items-center gap-10 md:flex">

      <a
        routerLink="/"
        class="text-[11px] font-medium uppercase tracking-[0.15em] transition-opacity duration-300 hover:opacity-50"
      >
        Home
      </a>

      <a
        routerLink="/shop"
        class="text-[11px] font-medium uppercase tracking-[0.15em] transition-opacity duration-300 hover:opacity-50"
      >
        Shop
      </a>

      <a
        routerLink="/collection"
        class="text-[11px] font-medium uppercase tracking-[0.15em] transition-opacity duration-300 hover:opacity-50"
      >
        Collection
      </a>

      <a
        routerLink="/about"
        class="text-[11px] font-medium uppercase tracking-[0.15em] transition-opacity duration-300 hover:opacity-50"
      >
        About
      </a>

      <a
        routerLink="/contact"
        class="text-[11px] font-medium uppercase tracking-[0.15em] transition-opacity duration-300 hover:opacity-50"
      >
        Contact
      </a>

    </div>


    <!-- ===================================================== -->
    <!-- ACTIONS -->
    <!-- ===================================================== -->

    <div class="flex items-center gap-4">


      <!-- ================================================= -->
      <!-- SEARCH -->
      <!-- ================================================= -->

      <form
        class="hidden items-center border-b border-[var(--color-border)] md:flex"
        (submit)="search()"
      >

        <input
          type="text"
          placeholder="Search"
          [value]="searchTerm()"
          (input)="searchTerm.set($any($event.target).value)"
          class="w-32 bg-transparent px-1 py-2 text-xs text-[var(--color-text)] outline-none placeholder:text-[var(--color-muted)] lg:w-40"
          aria-label="Search products"
        />

        <button
          type="submit"
          aria-label="Search products"
          class="p-1 transition-opacity duration-300 hover:opacity-50"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>

        </button>

      </form>


      <!-- ================================================= -->
      <!-- ACCOUNT -->
      <!-- ================================================= -->

      <button
        type="button"
        aria-label="Account"
        class="hidden p-1 transition-opacity duration-300 hover:opacity-50 sm:block"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
        </svg>

      </button>


      <!-- ================================================= -->
      <!-- WISHLIST -->
      <!-- ================================================= -->

      <a
        routerLink="/wishlist"
        aria-label="Wishlist"
        class="relative flex items-center gap-1 p-1 transition-opacity duration-300 hover:opacity-50"
      >
        <!-- Heart -->

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="h-5 w-5"
        >
          <path
            d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4Z"
          ></path>
        </svg>

        <!-- Wishlist Count -->

        <span class="text-[10px]">
          {{ wishlistCount$ | async }}
        </span>

      </a>


      <!-- ================================================= -->
      <!-- SHOPPING BAG -->
      <!-- ================================================= -->

      <a
        routerLink="/cart"
        aria-label="Shopping bag"
        class="relative flex items-center gap-1 p-1 transition-opacity duration-300 hover:opacity-50"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 8h12l1 13H5L6 8Z"></path>
          <path d="M9 8a3 3 0 0 1 6 0"></path>
        </svg>

        <span class="text-[10px]">
          {{ cartItemCount$ | async }}
        </span>

      </a>


      <!-- ================================================= -->
      <!-- MOBILE MENU BUTTON -->
      <!-- ================================================= -->

      <button
        type="button"
        aria-label="Toggle navigation menu"
        class="p-1 transition-opacity duration-300 hover:opacity-50 md:hidden"
        (click)="toggleMenu()"
      >

        @if (isMenuOpen()) {

          <!-- X ICON -->

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12"></path>
            <path d="M18 6 6 18"></path>
          </svg>

        } @else {

          <!-- MENU ICON -->

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
          </svg>

        }

      </button>

    </div>

  </nav>


  <!-- ===================================================== -->
  <!-- MOBILE NAVIGATION -->
  <!-- ===================================================== -->

  @if (isMenuOpen()) {

    <div
      class="border-t border-[var(--color-border)] bg-[var(--color-background)] md:hidden"
    >

      <div class="px-6 py-8">


        <!-- =============================================== -->
        <!-- MOBILE LINKS -->
        <!-- =============================================== -->

        <div class="flex flex-col">

          <a
            routerLink="/"
            (click)="closeMenu()"
            class="border-b border-[var(--color-border)] py-4 text-sm uppercase tracking-[0.15em]"
          >
            Home
          </a>

          <a
            routerLink="/shop"
            (click)="closeMenu()"
            class="border-b border-[var(--color-border)] py-4 text-sm uppercase tracking-[0.15em]"
          >
            Shop
          </a>

          <a
            routerLink="/collection"
            (click)="closeMenu()"
            class="border-b border-[var(--color-border)] py-4 text-sm uppercase tracking-[0.15em]"
          >
            Collection
          </a>

          <a
            routerLink="/about"
            (click)="closeMenu()"
            class="border-b border-[var(--color-border)] py-4 text-sm uppercase tracking-[0.15em]"
          >
            About
          </a>

          <a
            routerLink="/contact"
            (click)="closeMenu()"
            class="py-4 text-sm uppercase tracking-[0.15em]"
          >
            Contact
          </a>

        </div>


        <!-- =============================================== -->
        <!-- MOBILE ACTIONS -->
        <!-- =============================================== -->

        <div
          class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-4 border-t border-[var(--color-border)] pt-6"
        >


          <!-- ============================================= -->
          <!-- MOBILE SEARCH -->
          <!-- ============================================= -->

          <form
            class="flex w-full items-center border-b border-[var(--color-border)]"
            (submit)="search()"
          >

            <input
              type="text"
              placeholder="Search"
              [value]="searchTerm()"
              (input)="searchTerm.set($any($event.target).value)"
              class="flex-1 bg-transparent px-1 py-2 text-xs text-[var(--color-text)] outline-none placeholder:text-[var(--color-muted)]"
              aria-label="Search products"
            />

            <button
              type="submit"
              aria-label="Search products"
              class="p-1 transition-opacity duration-300 hover:opacity-50"
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
              </svg>

            </button>

          </form>


          <!-- ============================================= -->
          <!-- ACCOUNT -->
          <!-- ============================================= -->

          <button
            type="button"
            class="flex items-center gap-2 text-xs uppercase tracking-[0.1em] transition-opacity hover:opacity-50"
          >

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
            </svg>

            Account

          </button>


          <!-- ============================================= -->
          <!-- WISHLIST -->
          <!-- ============================================= -->

          <a
            routerLink="/wishlist"
            (click)="closeMenu()"
            class="flex items-center gap-2 text-xs uppercase tracking-[0.1em] transition-opacity hover:opacity-50"
          >

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4Z"
              ></path>
            </svg>

            Wishlist

          </a>


          <!-- ============================================= -->
          <!-- SHOPPING BAG -->
          <!-- ============================================= -->

          <a
            routerLink="/cart"
            (click)="closeMenu()"
            class="flex items-center gap-2 text-xs uppercase tracking-[0.1em] transition-opacity hover:opacity-50"
          >

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 8h12l1 13H5L6 8Z"></path>
              <path d="M9 8a3 3 0 0 1 6 0"></path>
            </svg>

            Bag

            <span>
              ({{ cartItemCount$ | async }})
            </span>

          </a>


        </div>

      </div>

    </div>

  }

</header>
