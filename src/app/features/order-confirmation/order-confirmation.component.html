@if (order$ | async; as order) {

  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-black/30 px-5 backdrop-blur-[2px]"
  >

    <div
      class="w-full max-w-md border border-brand-border bg-[#F3F0EC] px-7 py-10 shadow-xl sm:px-10 sm:py-12"
    >

      <!-- Check -->

      <div
        class="mx-auto flex h-14 w-14 items-center justify-center rounded-full border border-brand-border"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m5 12 4 4L19 6"></path>
        </svg>

      </div>


      <!-- Heading -->

      <div class="mt-7 text-center">

        <p
          class="text-[10px] uppercase tracking-[0.25em] text-brand-muted"
        >
          Order Confirmed
        </p>

        <h1
          class="mt-4 text-2xl font-light tracking-tight text-brand-text sm:text-3xl"
        >
          Thank you for your order.
        </h1>

        <p
          class="mt-4 text-sm leading-6 text-brand-muted"
        >
          Your order has been received and is being prepared.
        </p>

      </div>


      <!-- Order Number -->

      <div
        class="mt-8 border-y border-brand-border py-5 text-center"
      >

        <p
          class="text-[10px] uppercase tracking-[0.2em] text-brand-muted"
        >
          Order Number
        </p>

        <p
          class="mt-2 text-sm font-medium tracking-wide text-brand-text"
        >
          {{ order.orderNumber }}
        </p>

      </div>


      <!-- Actions -->

      <div class="mt-8">

        <a
          [routerLink]="[
            '/orders',
            order.id
          ]"
          class="flex w-full items-center justify-center bg-brand-text px-6 py-4 text-xs font-medium uppercase tracking-[0.15em] text-white transition-opacity hover:opacity-90"
        >
          View Order
        </a>


        <a
          routerLink="/shop"
          class="mt-3 flex w-full items-center justify-center border border-brand-border px-6 py-4 text-xs font-medium uppercase tracking-[0.15em] text-brand-text transition-colors hover:border-brand-text"
        >
          Continue Shopping
        </a>

      </div>

    </div>

  </div>

} @else {

  <!-- Loading -->

  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-brand-background"
  >

    <div class="text-center">

      <p
        class="text-xs uppercase tracking-[0.25em] text-brand-muted"
      >
        Loading
      </p>

      <p
        class="mt-4 text-sm text-brand-muted"
      >
        Preparing your order confirmation...
      </p>

    </div>

  </div>

}
