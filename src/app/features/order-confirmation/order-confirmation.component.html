@if (order$ | async; as order) {

  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-white px-5"
  >

    <div
      class="w-full max-w-md border border-brand-border bg-white px-7 py-10 shadow-[0_20px_60px_rgba(0,0,0,0.08)] sm:px-10 sm:py-12"
    >

      <!-- Success Icon -->

      <div
        class="mx-auto flex h-14 w-14 items-center justify-center rounded-full border border-brand-text"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m5 12 4 4L19 6"></path>
        </svg>

      </div>


      <!-- Confirmation Content -->

      <div class="mt-7 text-center">

        <p
          class="text-[10px] font-medium uppercase tracking-[0.28em] text-brand-muted"
        >
          Order Confirmed
        </p>

        <h1
          class="mt-4 text-2xl font-light tracking-tight text-brand-text sm:text-3xl"
        >
          Thank you for your order.
        </h1>

        <p
          class="mx-auto mt-4 max-w-sm text-sm leading-6 text-brand-muted"
        >
          Your order has been received successfully and is now being prepared.
        </p>

      </div>


      <!-- Order Number -->

      <div
        class="mt-8 border-y border-brand-border py-5 text-center"
      >

        <p
          class="text-[9px] font-medium uppercase tracking-[0.25em] text-brand-muted"
        >
          Order Number
        </p>

        <p
          class="mt-2 text-sm font-medium tracking-[0.08em] text-brand-text"
        >
          {{ order.orderNumber }}
        </p>

      </div>


      <!-- Actions -->

      <div class="mt-8">

        <!-- View Order -->

        <a
          [routerLink]="[
            '/orders',
            order.id
          ]"
          class="flex w-full items-center justify-center bg-brand-text px-6 py-4 text-[10px] font-medium uppercase tracking-[0.2em] text-white transition-opacity duration-200 hover:opacity-85"
        >
          View Order
        </a>


        <!-- Continue Shopping -->

        <a
          routerLink="/shop"
          class="mt-3 flex w-full items-center justify-center border border-brand-text bg-white px-6 py-4 text-[10px] font-medium uppercase tracking-[0.2em] text-brand-text transition-colors duration-200 hover:bg-brand-text hover:text-white"
        >
          Continue Shopping
        </a>

      </div>


      <!-- Brand Detail -->

      <div class="mt-8 text-center">

        <div
          class="mx-auto mb-3 h-px w-8 bg-brand-border"
        ></div>

        <p
          class="text-[9px] uppercase tracking-[0.3em] text-brand-muted"
        >
          SA — Modern Menswear
        </p>

      </div>

    </div>

  </div>

} @else {

  <!-- Loading -->

  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-white px-5"
  >

    <div class="text-center">

      <p
        class="text-[10px] font-medium uppercase tracking-[0.28em] text-brand-muted"
      >
        Loading
      </p>

      <div
        class="mx-auto mt-5 h-px w-8 bg-brand-border"
      ></div>

      <p
        class="mt-5 text-sm text-brand-muted"
      >
        Preparing your order confirmation...
      </p>

    </div>

  </div>

}
