@if (product()) {

  <!-- ===================================================== -->
  <!-- BACKDROP -->
  <!-- ===================================================== -->

  <div
    class="fixed inset-0 z-50 flex items-end justify-center bg-black/30 p-0 sm:items-center sm:p-6"
  >

    <!-- =================================================== -->
    <!-- MODAL -->
    <!-- =================================================== -->

    <div
      class="relative w-full max-w-lg bg-white shadow-2xl"
    >

      <!-- ================================================= -->
      <!-- CLOSE BUTTON -->
      <!-- ================================================= -->

      <button
        type="button"
        (click)="closeModal()"
        aria-label="Close"
        class="absolute right-5 top-5 z-10 flex h-8 w-8 items-center justify-center text-brand-text transition-opacity duration-300 hover:opacity-50"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="h-5 w-5"
        >
          <path d="M6 6l12 12"></path>
          <path d="M18 6L6 18"></path>
        </svg>

      </button>


      <!-- ================================================= -->
      <!-- PRODUCT -->
      <!-- ================================================= -->

      <div class="grid grid-cols-3 gap-5 p-6">

        <!-- Product Image -->

        <div class="col-span-1 overflow-hidden bg-brand-surface">

          <div class="aspect-[3/4]">

            <img
              [src]="product().images[0]"
              [alt]="product().name"
              class="h-full w-full object-cover"
            />

          </div>

        </div>


        <!-- Product Information -->

        <div class="col-span-2">

          <p
            class="text-[10px] uppercase tracking-[0.2em] text-brand-muted"
          >
            {{ product().category }}
          </p>

          <h2
            class="mt-2 pr-8 text-lg font-medium text-brand-text"
          >
            {{ product().name }}
          </h2>

          <p class="mt-2 text-sm text-brand-text">
            ₹{{ product().price }}
          </p>


          <!-- ============================================= -->
          <!-- SIZE -->
          <!-- ============================================= -->

          <div class="mt-6">

            <div class="flex items-center justify-between">

              <p
                class="text-[10px] font-medium uppercase tracking-[0.15em] text-brand-text"
              >
                Size
              </p>

              @if (!selectedSize()) {

                <span
                  class="text-[10px] text-brand-muted"
                >
                  Select a size
                </span>

              }

            </div>


            <div class="mt-3 flex flex-wrap gap-2">

              @for (
                size of product().sizes;
                track size
              ) {

                <button
                  type="button"
                  (click)="selectSize(size)"
                  [class.bg-brand-text]="selectedSize() === size"
                  [class.text-white]="selectedSize() === size"
                  [class.border-brand-text]="selectedSize() === size"
                  class="min-w-10 border border-brand-border px-3 py-2 text-xs text-brand-text transition-colors duration-200 hover:border-brand-text"
                >
                  {{ size }}
                </button>

              }

            </div>

          </div>

        </div>

      </div>


      <!-- ================================================= -->
      <!-- ADD TO CART -->
      <!-- ================================================= -->

      <div class="border-t border-brand-border p-6">

        <button
          type="button"
          (click)="addProductToCart()"
          [disabled]="
            !selectedSize() ||
            product().stock === 0
          "
          class="w-full bg-brand-text px-6 py-4 text-[11px] font-medium uppercase tracking-[0.15em] text-white transition-opacity duration-300 hover:opacity-80 disabled:cursor-not-allowed disabled:opacity-40"
        >

          @if (product().stock === 0) {

            Out of Stock

          } @else {

            Add to Cart

          }

        </button>

      </div>

    </div>

  </div>

}
