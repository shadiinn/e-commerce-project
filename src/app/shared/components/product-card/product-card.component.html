<article class="group">

  <!-- ===================================================== -->
  <!-- PRODUCT IMAGE -->
  <!-- ===================================================== -->

  <div
    class="relative overflow-hidden bg-brand-surface"
  >

    <!-- ================================================= -->
    <!-- PRODUCT LINK -->
    <!-- ================================================= -->

    <a
      [routerLink]="['/products', product().id]"
      class="block"
    >

      <div class="aspect-[3/4] overflow-hidden">

        <img
          [src]="product().images[0]"
          [alt]="product().name"
          class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
        />

      </div>

    </a>


    <!-- ================================================= -->
    <!-- HOVER ACTIONS -->
    <!-- ================================================= -->

    <div
      class="pointer-events-none absolute inset-0"
    >

      <!-- ============================================= -->
      <!-- WISHLIST -->
      <!-- ============================================= -->

      <button
        type="button"
        (click)="toggleWishlist()"
        aria-label="Add to wishlist"
        class="pointer-events-none absolute right-4 top-4 flex h-9 w-9 translate-y-2 items-center justify-center bg-white/95 opacity-0 shadow-sm transition-all duration-300 group-hover:pointer-events-auto group-hover:translate-y-0 group-hover:opacity-100"
      >

        @if (isWishlisted$ | async) {

          <!-- ========================================= -->
          <!-- FILLED HEART -->
          <!-- ========================================= -->

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4Z"
            ></path>
          </svg>

        } @else {

          <!-- ========================================= -->
          <!-- OUTLINE HEART -->
          <!-- ========================================= -->

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4Z"
            ></path>
          </svg>

        }

      </button>


      <!-- ============================================= -->
      <!-- ADD TO CART -->
      <!-- ============================================= -->

      <div
        class="absolute bottom-4 left-4 right-4 translate-y-3 opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100"
      >

        <button
          type="button"
          (click)="openQuickAdd()"
          class="pointer-events-auto w-full bg-white px-5 py-3 text-[11px] font-medium uppercase tracking-[0.15em] text-brand-text shadow-sm transition-colors duration-300 hover:bg-brand-text hover:text-white"
        >
          Add to Cart
        </button>

      </div>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- PRODUCT INFORMATION -->
  <!-- ===================================================== -->

  <div class="pt-4">

    <div class="flex items-start justify-between gap-4">

      <div>

        <h3 class="text-sm font-medium text-brand-text">
          {{ product().name }}
        </h3>

        <p class="mt-1 text-sm text-brand-muted">
          {{ product().category }}
        </p>

      </div>


      <p class="text-sm font-medium text-brand-text">
        ₹{{ product().price }}
      </p>

    </div>

  </div>

</article>


<!-- Quick Add -->

@if (isQuickAddOpen()) {

  <app-quick-add
    [product]="product()"
    (close)="closeQuickAdd()"
  />

}
